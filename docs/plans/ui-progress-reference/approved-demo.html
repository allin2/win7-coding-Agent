<body>

<div class="demo-bar"><strong>UI DEMO / 02</strong><span class="demo-note">完整流程 · 所有操作均为模拟</span><span class="spacer"></span><label for="scenario">演示场景</label><select id="scenario"><option value="normal">读取 → 修改 → 验证</option><option value="push">外部写入审批</option><option value="wait">长时间等待模型</option><option value="failure">工具失败 → 重试</option><option value="residue">停止但清理未确认</option></select><button id="play" class="secondary">播放流程</button><button id="restart" class="secondary">模拟重启</button></div>
<div class="global-note" id="storageNote">仅使用示例文本。演示历史与草稿在当前浏览器标签页会话中保存，未加密；不连接模型或真实工作区。</div>
<div class="app">
<header class="top"><button class="mobile-nav" id="navToggle" aria-label="展开对话导航" aria-controls="sidebar" aria-expanded="false">☰</button><div class="brand"><span class="logo">W7</span><span class="brand-name">Coding Agent</span></div><button class="workspace" id="workspaceSelect" aria-haspopup="dialog"><strong id="workspaceName"></strong><small id="workspacePath" class="mono"></small></button><div class="top-actions"><span class="badge runtime-chip" id="runtimeChip">● Runtime 就绪 · 模拟</span><button class="provider secondary" id="provider">模型连接</button><button class="secondary" id="mode" aria-haspopup="dialog">Full Access ▾</button><button class="secondary" id="inspectToggle" aria-controls="inspector" aria-expanded="true" title="检查器 Ctrl+I">检查器 ◫</button></div></header>
<div class="body"><button class="backdrop" id="backdrop" aria-label="收起侧栏"></button>
<aside class="sidebar" id="sidebar" aria-label="对话导航"><button class="new" id="new">＋ 新建对话</button><label for="search" hidden>搜索对话标题</label><input class="searchbox" id="search" type="search" placeholder="搜索标题，含已归档 · Ctrl+K"><div class="side-scroll" id="directory"></div><div class="side-controls"><button id="rename">重命名</button><button id="archive">归档当前</button></div><div class="side-bottom"><p id="trustText"></p><button id="settings">⚙ 设置</button><button id="diagnostics">诊断 ↗</button><button disabled title="当前 Alpha 1 不支持完整 Review">Review · Alpha 2</button></div></aside>
<main class="center"><div class="heading"><div><div class="eyebrow">工作区 / 对话</div><h1 id="title"></h1><small id="subtitle"></small></div><span class="badge" id="status"></span></div><section class="stream" id="stream" aria-label="任务过程和结果"><div class="stream-inner" id="messages"></div></section><footer class="composer-wrap"><button id="jumpLatest" class="jump-latest" hidden>有新的活动，回到最新 ↓</button><div class="state-line"><span class="status-copy" id="liveStatus" role="status" aria-live="polite"></span><span id="elapsed" class="muted"></span></div><div class="composer"><label for="prompt" hidden>任务描述，仅输入演示文本</label><textarea id="prompt" rows="2" maxlength="2000" placeholder="描述你想完成的事…"></textarea><div class="composer-row"><small id="inputHint">Enter 发送 · Shift+Enter 换行</small><button class="primary" id="send">发送 ↑</button><button class="secondary danger" id="stop" hidden>■ 停止</button></div></div><div class="composer-footer"><span id="draftStatus"></span><span>本地演示 · 无真实命令</span></div></footer></main>
<aside class="inspector" id="inspector" aria-label="工作区检查器"><div class="inspector-head">工作区检查器<button id="closeInspector" aria-label="收起检查器">×</button></div><div class="tabs" role="tablist" aria-label="检查器内容"><button id="tab-files" role="tab" data-tab="files" aria-controls="files" aria-selected="true">文件</button><button id="tab-changes" role="tab" data-tab="changes" aria-controls="changes" aria-selected="false" tabindex="-1">变更</button><button id="tab-activity" role="tab" data-tab="activity" aria-controls="activity" aria-selected="false" tabindex="-1">活动</button><button id="tab-env" role="tab" data-tab="env" aria-controls="env" aria-selected="false" tabindex="-1">环境</button></div><section class="panel" id="files" role="tabpanel" aria-labelledby="tab-files"></section><section class="panel" id="changes" role="tabpanel" aria-labelledby="tab-changes" hidden></section><section class="panel" id="activity" role="tabpanel" aria-labelledby="tab-activity" hidden></section><section class="panel" id="env" role="tabpanel" aria-labelledby="tab-env" hidden></section></aside>
</div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><p id="dialogError" class="dialog-error" role="alert"></p><div class="buttons"><button id="dialogClose" class="secondary">取消</button><button id="dialogAction" class="primary"></button></div></dialog><div class="feedback" id="feedback" role="status" hidden></div>

<script>

/* Pure demo state model. No filesystem, process, network, or provider integration. */
const DemoModel = (() => {
  let serial = 0;
  const id = () => 'demo-' + Date.now().toString(36) + '-' + (++serial);
  const stamp = () => new Date().toISOString();
  const workspaces = [
    {id:'agent',name:'编码助手',path:'C:\\项目\\编码助手',mode:'Full Access',modelReady:true},
    {id:'docs',name:'内部文档',path:'D:\\团队资料\\内部文档',mode:'Read Only',modelReady:true}
  ];
  const labels = {idle:'准备就绪',running:'执行中',waiting:'等待模型',approval:'等待你的批准',stopping:'正在停止',completed:'已完成',failed:'执行失败',cancelled:'已停止',rejected:'已拒绝',interrupted:'已中断',residue:'清理未确认'};
  function conv(m){return m.conversations.find(c=>c.id===m.active)}
  function ws(m){return m.workspaces.find(w=>w.id===m.workspace)}
  function turn(m){const c=conv(m);return c&&c.turns[c.turns.length-1]}
  function busy(m){return m.conversations.some(c=>c.workspace===m.workspace&&c.turns.some(t=>['running','waiting','approval','stopping'].includes(t.status)))}
  function unresolved(m){return m.conversations.filter(c=>c.workspace===m.workspace).flatMap(c=>c.turns).find(t=>t.status==='residue')}
  function addEvent(t,type,label,detail='',status='completed',extra={}){const e={id:id(),type,label,detail,status,time:stamp(),...extra};t.events.push(e);return e}
  function newConversation(m,title='新对话'){if(busy(m))return null;const c={id:id(),workspace:m.workspace,title,archived:false,draft:'',turns:[]};m.conversations.unshift(c);m.active=c.id;return c}
  function create(){
    const m={schema:2,workspaces:workspaces.map(w=>({...w})),workspace:'agent',active:null,conversations:[]};
    newConversation(m,'检查中文路径与编码');const a=start(m,'检查中文路径与编码','normal');addEvent(a,'note','先检查路径与文件编码。');addEvent(a,'tool','读取 README.md','UTF-8 · 已读取 8 行','completed',{path:'README.md'});finish(a,'completed','检查完成','示例结果：路径包含中文与空格，读取成功。');m.conversations[0].archived=true;
    newConversation(m,'梳理项目入口');const b=start(m,'梳理项目入口','normal');addEvent(b,'note','先检查目录，再定位应用入口。');addEvent(b,'tool','读取 package.json','已定位入口 src/main.js','completed',{path:'package.json'});finish(b,'completed','已定位主要入口','示例：src/main.js 负责启动。');
    newConversation(m,'优化工作台的进度反馈');return m;
  }
  function start(m,request,kind){
    if(busy(m)||unresolved(m))return null;
    const c=conv(m);if(!c||c.archived||!ws(m).modelReady)return null;
    if(ws(m).mode==='Read Only'&&['push','failure','residue','retry'].includes(kind))return null;
    const t={id:id(),request,kind,mode:ws(m).mode,created:stamp(),status:'running',events:[],plan:[],checkpoint:null};
    c.turns.push(t);if(c.title==='新对话')c.title=request.slice(0,32);c.draft='';return t;
  }
  function finish(t,status,label,detail){t.status=status;addEvent(t,'result',label,detail,status)}
  function updateTool(t,label,status,detail){const e=[...t.events].reverse().find(e=>e.type==='tool'&&e.label===label&&e.status==='running');if(e){e.status=status;e.detail=detail;e.ended=stamp()}return e}
  function archive(m,cid){if(busy(m))return false;const c=m.conversations.find(c=>c.id===cid&&c.workspace===m.workspace);if(!c)return false;c.archived=true;if(m.active===cid){const next=m.conversations.find(x=>x.workspace===m.workspace&&!x.archived);if(next)m.active=next.id;else newConversation(m)}return true}
  function restore(m,cid){if(busy(m))return false;const c=m.conversations.find(c=>c.id===cid&&c.workspace===m.workspace);if(!c)return false;c.archived=false;m.active=c.id;return true}
  function select(m,cid){if(busy(m))return false;const c=m.conversations.find(c=>c.id===cid&&c.workspace===m.workspace&&!c.archived);if(!c)return false;m.active=cid;return true}
  function switchWorkspace(m,wid){if(busy(m)||!m.workspaces.some(w=>w.id===wid))return false;m.workspace=wid;const c=m.conversations.find(c=>c.workspace===wid&&!c.archived);if(c)m.active=c.id;else newConversation(m);return true}
  function recover(m){
    for(const c of m.conversations)for(const t of c.turns)if(['running','waiting','approval','stopping'].includes(t.status)){
      for(const e of t.events){if(e.status==='running')e.status='interrupted';if(e.type==='approval'&&e.status==='pending')e.status='expired'}
      finish(t,'interrupted','上次任务已中断','保留已有记录；未自动续跑模型、工具或旧审批。');
    }return m;
  }
  function decide(m,approved){const t=turn(m);if(!t||t.status!=='approval'||ws(m).mode!=='Full Access')return false;const e=t.events.find(e=>e.type==='approval'&&e.status==='pending');if(!e)return false;e.status=approved?'approved':'rejected';e.decided=stamp();t.status=approved?'running':'rejected';if(!approved)finish(t,'rejected','已拒绝此操作','命令未执行。可修改要求后重新发送。');return true}
  return {create,conv,ws,turn,busy,unresolved,addEvent,start,finish,updateTool,newConversation,archive,restore,select,switchWorkspace,recover,decide,labels};
})();

/* UI controller */

const $=id=>document.getElementById(id), D=DemoModel, storageKey='coding-agent-ui-demo-v2';
let m=D.create(), storageOK=true, timerIds=[], lastFocus=null, noticeTimer=null, filePath='', folder='', selectedTab='files', readOnlyFocus=null;
try{const raw=sessionStorage.getItem(storageKey);if(raw){const data=JSON.parse(raw);if(data.schema===2&&Array.isArray(data.conversations)&&Array.isArray(data.workspaces)&&data.conversations.some(c=>c.id===data.active))m=D.recover(data)}}catch(e){storageOK=false}
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=v=>new Date(v).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
function persist(){try{sessionStorage.setItem(storageKey,JSON.stringify(m));storageOK=true}catch(e){storageOK=false}$('storageNote').textContent=storageOK?'仅使用示例文本。演示历史与草稿在当前浏览器标签页会话中保存，未加密；不连接模型或真实工作区。':'浏览器会话保存不可用；当前仅在内存中演示，刷新会丢失记录。'}
function notice(s){clearTimeout(noticeTimer);$('feedback').textContent=s;$('feedback').hidden=false;noticeTimer=setTimeout(()=>$('feedback').hidden=true,4000)}
function stopTimers(){timerIds.forEach(clearTimeout);timerIds=[]}
function later(t,ms,fn){timerIds.push(setTimeout(()=>{if(D.turn(m)!==t||!['running','waiting'].includes(t.status))return;fn();commit()},ms))}
function commit(){persist();render()}
function toolsSummary(es){const active=es.find(e=>e.status==='running');if(active)return '◌ 正在'+active.label+' · '+es.length+' 项活动';const fail=es.filter(e=>e.status==='failed').length;const done=es.filter(e=>e.status==='completed').length;return '⌘ '+done+' 项完成'+(fail?' · '+fail+' 次失败':'')+' · 展开活动'}
function toolHtml(e){const names={running:'执行中',completed:'成功',failed:'失败',cancelled:'已停止',interrupted:'已中断',residue:'清理未确认'};return '<div class="tool-item"><div><span class="tool-state '+esc(e.status)+'">'+esc(names[e.status]||e.status)+'</span><span>'+esc(e.label)+'</span><small>'+clock(e.time)+'</small></div><pre>'+esc(e.detail||'等待结果')+'</pre></div>'}
function eventHtml(e){
  if(e.type==='note')return '<p class="note">'+esc(e.label)+'</p>';
  if(e.type==='wait')return '<div class="waiting-line">'+esc(e.label)+' <span class="wait-clock" data-since="'+esc(e.time)+'"></span></div>';
  if(e.type==='approval'){
    const pending=e.status==='pending',stateText={pending:'需要你的确认',approved:'已批准',rejected:'已拒绝',expired:'审批已失效'};
    return '<section class="approval '+(pending?'':'record')+'"><div class="approval-top">◇ '+stateText[e.status]+'</div><p>'+(pending?'该操作将更新远端分支；本地撤销不能撤回推送。':'决定时间：'+clock(e.decided||e.time)+' · '+(e.status==='expired'?'任务中断后旧审批不可重用':'记录保留供回看'))+'</p><dl class="binding"><dt>目标</dt><dd>'+esc(e.target)+'</dd><dt>工作目录</dt><dd class="mono">'+esc(e.cwd)+'</dd><dt>强制 / 删除</dt><dd>否 / 否</dd></dl><details '+(pending?'open':'')+'><summary>完整命令与审批标识</summary><pre class="command">'+esc(e.command)+'\n'+esc(e.id)+'</pre></details>'+(pending?'<div class="approval-actions"><button class="primary" data-action="approve">批准此操作</button><button class="secondary" data-action="reject">拒绝</button><small>只批准上方目标与命令</small></div>':'')+'</section>';
  }
  if(e.type==='result'){return '<section class="outcome '+(e.status==='failed'?'error':['residue','interrupted'].includes(e.status)?'warning':'')+'"><h2>'+esc(e.label)+'</h2><p>'+esc(e.detail)+'</p>'+(e.status==='failed'?'<button class="secondary" data-action="retry" '+(D.busy(m)||D.unresolved(m)||D.ws(m).mode==='Read Only'?'disabled':'')+'>新建一次重试</button>':'')+'</section>'}
  return '';
}
function renderMessages(){
  const box=$('stream'),nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80,oldScroll=box.scrollTop;
  const opens=new Set([...$('messages').querySelectorAll('details[open][data-group]')].map(x=>x.dataset.group));
  const c=D.conv(m);
  if(!c.turns.length){$('messages').innerHTML='<div class="welcome"><div class="eyebrow">每一步，都有迹可循</div><h2>今天想完成什么？</h2><p>发起任务后，可以看到进度说明、实际活动、需要你的决定，以及最终结果。</p><button class="secondary" data-action="suggest">演示工作台优化流程</button><button class="secondary" data-action="suggest-read">梳理项目入口</button><p><small>顶部可选择等待、失败、审批等场景。</small></p></div>';return}
  $('messages').innerHTML=c.turns.map(t=>{
    let content='';
    for(let i=0;i<t.events.length;i++){
      const e=t.events[i];
      if(e.type==='tool'){
        const batch=[e];while(i+1<t.events.length&&t.events[i+1].type==='tool')batch.push(t.events[++i]);
        content+='<details class="activity-group" data-group="'+e.id+'" '+(opens.has(e.id)?'open':'')+'><summary>'+esc(toolsSummary(batch))+'</summary>'+batch.map(toolHtml).join('')+'</details>';
      }else content+=eventHtml(e);
    }
    const plan=t.plan.length?'<div class="plan" aria-label="任务计划">'+t.plan.map(p=>'<span class="'+p.state+'">'+(p.state==='done'?'✓ ':p.state==='doing'?'◌ ':'○ ')+esc(p.name)+'</span>').join('')+'</div>':'';
    return '<article class="turn"><div class="author"><span class="avatar">你</span><strong>你</strong><small>'+clock(t.created)+'</small></div><div class="user-message">'+esc(t.request)+'</div><div class="author"><span class="avatar agent">A</span><strong>Agent</strong><span class="badge">'+esc(D.labels[t.status])+'</span></div>'+plan+content+'<div class="turn-footer"><span>'+esc(t.id)+'</span><button data-copy="'+esc(t.id)+'">复制轮次 ID</button></div></article>';
  }).join('');
  if(nearBottom){box.scrollTop=box.scrollHeight;$('jumpLatest').hidden=true}else{box.scrollTop=oldScroll;$('jumpLatest').hidden=false}
}

function execute(kind,request){
  const t=D.start(m,request,kind);if(!t){notice('当前状态不允许启动此场景。只读模式不能运行 Shell。');return}
  stopTimers();
  t.plan=[{name:'检查',state:'doing'},{name:t.mode==='Read Only'?'分析':'执行',state:'todo'},{name:'汇总',state:'todo'}];
  D.addEvent(t,'note',kind==='push'?'我会核对推送目标，并在外部写入前等待你的批准。':'我会先读取相关文件，定位入口，再给出下一步结果。');
  if(kind==='wait'){
    t.status='waiting';D.addEvent(t,'wait','请求已发出，等待模型响应。');commit();return;
  }
  D.addEvent(t,'tool','读取 README.md','正在读取文件…','running',{path:'README.md'});commit();
  later(t,1400,()=>{D.updateTool(t,'读取 README.md','completed','UTF-8 · 已读取 8 行');D.addEvent(t,'tool','读取 src/main.js','正在读取入口文件…','running',{path:'src/main.js'})});
  later(t,2900,()=>{
    D.updateTool(t,'读取 src/main.js','completed','UTF-8 · 已读取 5 行');
    t.plan[0].state='done';t.plan[1].state='doing';
    if(kind==='push'){
      D.addEvent(t,'note','读取阶段已结束。下一步会更新远端分支，需要你确认完整目标和命令。');
      D.addEvent(t,'approval','推送当前提交','','pending',{target:'origin · C:\\团队仓库\\agent.git → refs/heads/ui-preview',cwd:D.ws(m).path,command:'C:\\Tools\\MinGit\\cmd\\git.exe push origin HEAD:refs/heads/ui-preview'});
      t.status='approval';return;
    }
    if(t.mode==='Read Only'){
      D.addEvent(t,'note','已找到入口文件。当前为只读模式，我会汇总观察，不修改文件或运行命令。');return;
    }
    if(kind==='failure'||kind==='residue'||kind==='retry'){
      D.addEvent(t,'note','已定位检查入口，现在运行示例检查命令。');
      D.addEvent(t,'tool','运行检查命令','node scripts/check.js','running');return;
    }
    D.addEvent(t,'note','已找到界面入口。接下来更新进度反馈说明，再检查变更。');
    D.addEvent(t,'tool','更新 README.md','增加进度反馈说明。','running',{path:'README.md'});
  });
  if(kind==='push'||kind==='residue')return;
  later(t,4500,()=>{
    if(kind==='retry'){
      D.updateTool(t,'运行检查命令','completed','退出码 0 · 本次模拟检查通过。');
      t.plan.forEach(p=>p.state='done');
      D.finish(t,'completed','本次重试检查通过','示例退出码 0。原失败轮次保留，未修改文件。');return;
    }
    if(kind==='failure'){
      D.updateTool(t,'运行检查命令','failed','退出码 1 · 示例依赖缺失，检查未通过。');
      D.addEvent(t,'note','检查失败：示例依赖缺失。我会停在这里，保留失败记录，等待你决定是否重试。');
      D.finish(t,'failed','检查未通过','未确认任务完成。重试会创建新一轮，保留本次失败记录。');return;
    }
    t.plan[1].state='done';t.plan[2].state='doing';
    if(t.mode!=='Read Only'){
      D.updateTool(t,'更新 README.md','completed','已增加 2 行说明。');
      t.checkpoint={id:'cp-'+t.id,path:'README.md',undone:false};
      D.addEvent(t,'note','说明已更新，现在检查修改后的内容。');
      D.addEvent(t,'tool','验证 README.md','正在读取修改结果…','running',{path:'README.md'});
    }else D.addEvent(t,'note','读取完成，正在整理入口与调用关系。');
  });
  later(t,6100,()=>{
    if(t.mode!=='Read Only')D.updateTool(t,'验证 README.md','completed','示例检查通过：新增说明可见。');
    t.plan.forEach(p=>p.state='done');
    D.finish(t,'completed',t.mode==='Read Only'?'分析完成':'变更与检查完成',t.mode==='Read Only'?'示例结果：src/main.js 为入口。没有修改文件或运行 Shell。':'示例结果：README.md 新增 2 行说明，检查完成；可在变更页查看 Diff 和撤销范围。');
  });
}

$('new').onclick=()=>{if(D.newConversation(m)){commit();$('prompt').focus()}};
$('search').oninput=renderDirectory;
$('directory').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.conversation&&D.select(m,b.dataset.conversation)){commit();nav(false)}if(b.dataset.restore&&D.restore(m,b.dataset.restore)){commit();notice('对话已恢复。')}};
$('settings').onclick=settings;$('provider').onclick=settings;
$('diagnostics').onclick=()=>{setTab('env');inspector(true);$('closeInspector').focus()};
$('inspectToggle').onclick=()=>{const open=getComputedStyle($('inspector')).display==='none';inspector(open);if(open&&innerWidth<=1180){readOnlyFocus=$('inspectToggle');$('closeInspector').focus()}};
$('closeInspector').onclick=()=>{inspector(false);$('inspectToggle').focus()};
$('navToggle').onclick=()=>{const open=!$('sidebar').classList.contains('open');nav(open);if(open){readOnlyFocus=$('navToggle');$('search').focus()}};
$('backdrop').onclick=()=>{inspector(false);nav(false);(readOnlyFocus||$('inspectToggle')).focus()};
document.querySelectorAll('[data-tab]').forEach((b,i,list)=>{b.onclick=()=>setTab(b.dataset.tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;setTab(list[j].dataset.tab);list[j].focus()}});
$('prompt').oninput=()=>{D.conv(m).draft=$('prompt').value;persist();$('send').disabled=!D.conv(m).draft.trim();$('draftStatus').textContent=storageOK?'草稿已保存到本标签页会话 · 未加密':'草稿仅在内存中'};
function send(){if($('send').disabled)return;const p=$('prompt').value.trim();if(p)execute($('scenario').value,p)}
$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send()}};
$('play').onclick=()=>execute($('scenario').value,{normal:D.ws(m).mode==='Read Only'?'请分析项目入口，不修改文件。':'请优化工作台进度反馈说明，并检查修改结果。',push:'请把当前提交推送到 origin 的 ui-preview 分支，不要强制推送。',wait:'请分析代码结构。',failure:'请运行项目检查。',residue:'请运行长任务，然后演示停止与清理状态。'}[$('scenario').value]);
$('stop').onclick=stop;
$('restart').onclick=()=>{stopTimers();D.recover(m);commit();notice('已模拟重启：历史保留，未完成任务记为中断；没有自动续跑。')};
$('jumpLatest').onclick=()=>{$('stream').scrollTop=$('stream').scrollHeight;$('jumpLatest').hidden=true};
$('messages').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.copy)copy(b.dataset.copy);
  if(b.dataset.action==='approve')approve(true);
  if(b.dataset.action==='reject')approve(false);
  if(b.dataset.action==='retry')execute('retry','重新运行项目检查；保留上次失败记录。');
  if(b.dataset.action==='suggest'||b.dataset.action==='suggest-read'){
    $('prompt').value=b.dataset.action==='suggest-read'?'请梳理项目入口。':'请优化工作台进度反馈说明。';D.conv(m).draft=$('prompt').value;persist();$('send').disabled=false;$('prompt').focus();
  }
};
$('inspector').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.folder){folder=b.dataset.folder;filePath='';renderPanel()}
  if(b.hasAttribute('data-up')){folder='';filePath='';renderPanel()}
  if(b.dataset.file){filePath=b.dataset.file;renderPanel()}
  if(b.hasAttribute('data-jump')){const n=Number($('lineNumber').value);if(!Number.isInteger(n)||n<1||n>(sampleFiles[filePath]||[]).length){notice('行号超出示例文件范围。');return}renderCode('',n)}
  if(b.hasAttribute('data-git-refresh')){renderPanel();notice('模拟 Git 状态已刷新。')}
  if(b.hasAttribute('data-output-copy'))copy(D.conv(m).turns.flatMap(t=>t.events).filter(e=>e.type==='tool').map(e=>e.label+'\n'+e.detail).join('\n\n'));
  if(b.dataset.undo){
    const t=D.conv(m).turns.find(t=>t.id===b.dataset.undo);if(!t?.checkpoint||D.busy(m)||D.ws(m).mode==='Read Only')return;
    modal('确认本地撤销范围','<p>'+esc(t.checkpoint.id)+'</p><div class="file">README.md · 撤销本轮增加的 2 行</div><p>不会撤回远端推送。真实执行前应检查文件漂移和冲突。</p>','模拟撤销',()=>{if(D.busy(m))return false;t.checkpoint.undone=true;D.addEvent(t,'note','用户模拟撤销了本轮本地变更。');commit();notice('模拟撤销完成，真实文件未改变。')});
  }
  if(b.hasAttribute('data-cleanup'))modal('模拟人工确认清理','<p>仅用于演示“清理未确认”后的恢复路径；真实产品需要依据进程清理证据作出判断。</p>','确认模拟清理',()=>{const t=D.unresolved(m);if(t?.status==='residue')D.finish(t,'cancelled','模拟清理已确认','可重新发起任务；先前清理未确认记录仍保留。');commit()});
};
$('files').addEventListener('input',e=>{if(e.target.id==='fileSearch')renderCode(e.target.value)});
$('files').addEventListener('change',e=>{if(e.target.id==='encoding')notice('编码选择已切换；示例文本不含原始文件字节，未执行真实重解码。')});
document.addEventListener('keydown',e=>{
  if($('dialog').open)return;
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();nav(true);$('search').focus()}
  if(e.ctrlKey&&e.key.toLowerCase()==='i'){e.preventDefault();$('inspectToggle').click()}
  if(e.key==='Escape'){inspector(false);nav(false);(readOnlyFocus||$('inspectToggle')).focus()}
  const overlay=innerWidth<=760&&$('sidebar').classList.contains('open')?$('sidebar'):innerWidth<=1180&&$('inspector').classList.contains('open')?$('inspector'):null;
  if(e.key==='Tab'&&overlay){const nodes=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select,summary,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}
});
window.addEventListener('resize',()=>{$('backdrop').classList.toggle('show-inspector',innerWidth<=1180&&$('inspector').classList.contains('open'));$('backdrop').classList.toggle('show-nav',innerWidth<=760&&$('sidebar').classList.contains('open'))});
window.addEventListener('beforeunload',persist);
if(innerWidth<=1180)inspector(false);setTab('files');persist();render();setInterval(updateClocks,1000);

</script>
</body>
</html>
