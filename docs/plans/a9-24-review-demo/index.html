<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A9-24 改动审阅 Demo</title>
<style>
:root{--bg:#f4f3ef;--panel:#faf9f6;--raised:#fff;--rail:#f0eee6;--line:#e6e3db;--line2:#d8d3c6;--text:#1f2328;--muted:#59616b;
--accent:#0f766e;--soft:#e7f3f0;--amber:#995d13;--amberbg:#fff6e8;--red:#a2342d;--redbg:#fdf1ef;--ok:#1f7a4d;--okbg:#edf6f1;
--mono:Consolas,"Microsoft YaHei UI",monospace}
*{box-sizing:border-box} html,body{margin:0;height:100%} [hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Microsoft YaHei","Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:5px 11px}
button:disabled{opacity:.45;cursor:not-allowed} button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border-color:transparent;background:none;color:var(--accent);padding:3px 6px}
button.small{padding:2px 9px;font-size:12.5px} button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:#263238;color:#e8ecef;font-size:13px}
.demo-bar button{background:#37474f;color:#fff;border-color:#546e7a;padding:3px 10px;font-size:12.5px}
.demo-bar .n{opacity:.75;margin-left:auto}
.wb{display:grid;grid-template-columns:220px minmax(0,1fr) 440px;height:calc(100% - 42px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.brand{font-weight:700}.brand span{background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;margin-right:6px}
.ws{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ws small{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.conv{background:var(--soft);border:1px solid #bfdcd6;border-radius:8px;padding:6px 10px;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.head h1{font-size:17px;margin:0;flex:1}.pill{border:1px solid var(--line2);border-radius:999px;padding:3px 12px;background:var(--raised);font-size:13px}
.stream{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:9px}
.u{align-self:flex-end;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:70%}
.note:before{content:"■ ";color:var(--accent);font-size:10px}
.act{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13.5px}
.tag{font-size:11.5px;border-radius:5px;padding:1px 6px;margin-right:6px;background:#eef0f3;color:#5b6472}.tag.w{background:#e8f0fe;color:#1d4ed8}.tag.ok{background:var(--okbg);color:var(--ok)}
.outcome{border-left:3px solid var(--accent);background:var(--raised);border-radius:8px;padding:8px 12px}
.chg{background:var(--raised);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.chg .top{display:flex;align-items:center;gap:8px}.chg .top b{flex:1}
.stat{font-family:var(--mono);font-size:12.5px}.plus{color:var(--ok)}.minus{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fcfcfb;cursor:pointer}
.chip.undone{text-decoration:line-through;color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:12px 18px;background:var(--panel)}
.box{border:1px solid var(--line2);border-radius:12px;background:var(--raised);padding:10px 12px;display:flex;gap:10px}
.box input{flex:1;border:0;outline:0;font:inherit}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.insp{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px}
.tabs button[aria-selected=true]{border-bottom-color:var(--accent);font-weight:700}
.list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.turn{border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.turn-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.turn-h b{flex:1}.turn-h small{color:var(--muted)}
.f{border-top:1px solid #f0eee8}.f:first-of-type{border-top:0}
.f-row{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer}
.op{font-size:11.5px;border-radius:5px;padding:1px 6px;font-weight:600}.op-M{background:#e8f0fe;color:#1d4ed8}.op-C{background:var(--okbg);color:var(--ok)}.op-D{background:var(--redbg);color:var(--red)}.op-X{background:var(--amberbg);color:var(--amber)}
.path{flex:1;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f.undone .path{text-decoration:line-through;color:var(--muted)}
.state{font-size:12px;color:var(--muted)}
.diff{font-family:var(--mono);font-size:12px;white-space:pre;overflow:auto;max-height:190px;padding:6px 12px;background:#fcfcfb;border-top:1px solid #f0eee8}
.diff .a{color:#1f7a4d;background:#eaf6ee;display:block}.diff .d{color:#a2342d;background:#fbeceb;display:block}.diff .h{color:#5b6472;display:block}
.f-act{display:flex;gap:6px;padding:6px 12px 10px;align-items:center}
.msg{font-size:12.5px;padding:6px 12px 10px}.msg.warn{color:var(--amber)}.msg.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#263238;color:#fff;padding:8px 10px 8px 14px;border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:9}
.toast button{background:#455a64;color:#fff;border-color:#607d8b;padding:2px 10px}
.empty{color:var(--muted);text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="demo-bar">
  <b>Demo 场景</b>
  <button id="d-reset">① 重新开始</button>
  <button id="d-run1">② 第 1 轮：修 bug + 补测试</button>
  <button id="d-run2">③ 第 2 轮：再改 calc.ts</button>
  <button id="d-ext">④ 模拟：外部编辑器改了 calc.test.ts</button>
  <span class="n">静态演示：无真实文件、模型或进程；用于确认“先写后审”的交互方向</span>
</div>
<div class="wb">
  <aside class="rail"><div class="brand"><span>W7</span>Coding Agent</div>
    <div class="ws"><b>calc 项目</b><small>C:\A9-Demo\示例 目录\calc</small></div>
    <div class="conv">修复计算逻辑</div>
    <div class="state" style="margin-top:auto">权限模式只有 Full Access / Read Only；不再有 Review 模式。</div>
  </aside>
  <main class="main">
    <div class="head"><h1>修复计算逻辑</h1><span class="pill">权限：Full Access</span><span class="pill" id="run">空闲</span></div>
    <div class="stream" id="stream"></div>
    <div class="composer"><div class="box"><input id="prompt" placeholder="继续描述任务…（不必先审阅上一轮）"><button class="primary" id="send">发送</button></div>
      <div class="hint">改动直接写入工作区，Agent 可以运行测试验证；不满意时在右侧按文件撤销。</div></div>
  </main>
  <section class="insp">
    <div class="tabs"><button aria-selected="true">改动</button><button disabled>文件</button><button disabled>诊断</button></div>
    <div class="list" id="list"></div>
  </section>
</div>
<script>
(function(){
const $=(i)=>document.getElementById(i), wait=(ms)=>new Promise(r=>setTimeout(r,ms));
let S; let pendingUndo=null;
const esc=(t)=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function reset(){ S={turns:[],running:false,open:null}; $('stream').innerHTML=''; render(); }
function say(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;$('stream').appendChild(d);$('stream').scrollTop=1e9;return d;}
function toast(text,undoFn){document.querySelectorAll('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=`<span>${text}</span>`;
  if(undoFn){const b=document.createElement('button');b.textContent='撤回';b.onclick=()=>{undoFn();d.remove();};d.appendChild(b);}
  document.body.appendChild(d);setTimeout(()=>d.remove(),undoFn?5000:2600);}
function stats(f){return f.diff.reduce((a,[k])=>{if(k==='a')a[0]++;if(k==='d')a[1]++;return a;},[0,0]);}
function turnStats(t){return t.files.filter(f=>f.op!=='X').reduce((a,f)=>{const s=stats(f);return[a[0]+s[0],a[1]+s[1]];},[0,0]);}

async function run(n){
  if(S.running) return; S.running=true; render();
  let t;
  if(n===1){
    say('u','修复 add 的计算错误并补一个测试');
    say('note','先读取 calc.ts。'); say('act','<span class="tag">读取</span>src/calc.ts'); await wait(400);
    t={n:1,id:'第 1 轮',files:[
      {path:'src/calc.ts',op:'M',diff:[['h','@@ -3,4 +3,4 @@'],['',' export function add(a: number, b: number) {'],['d','-  return a - b;'],['a','+  return a + b;'],['',' }']]},
      {path:'tests/calc.test.ts',op:'C',diff:[['h','@@ -0,0 +1,5 @@'],['a',"+import { add } from '../src/calc';"],['a','+'],['a',"+test('add', () => {"],['a','+  expect(add(2, 3)).toBe(5);'],['a','+});']]},
      {path:'coverage/lcov.info',op:'X',why:'由命令 npx jest --coverage 生成（2.4 MB，超过备份上限），无法撤销',diff:[]},
    ]};
    say('act','<span class="tag w">修改</span>src/calc.ts'); await wait(300);
    say('act','<span class="tag w">新建</span>tests/calc.test.ts'); await wait(300);
    say('act','<span class="tag ok">运行命令</span>npx jest --coverage · exit=0 · 1 passed'); await wait(300);
  } else {
    say('u','给 add 加上参数校验');
    t={n:2,id:'第 2 轮',files:[{path:'src/calc.ts',op:'M',diff:[['h','@@ -3,3 +3,4 @@'],['',' export function add(a: number, b: number) {'],['a',"+  if (!Number.isFinite(a) || !Number.isFinite(b)) throw new TypeError('bad input');"],['','   return a + b;']]}]};
    say('act','<span class="tag w">修改</span>src/calc.ts'); await wait(300);
    say('act','<span class="tag ok">运行命令</span>npx jest · exit=0 · 1 passed'); await wait(300);
  }
  S.turns.unshift(t); S.running=false;
  say('outcome','<b>完成 · 已验证</b>');
  const [p,m]=turnStats(t);
  const card=say('chg',`<div class="top"><b>${t.id}改动了 ${t.files.filter(f=>f.op!=='X').length} 个文件</b><span class="stat"><span class="plus">+${p}</span> <span class="minus">−${m}</span></span><button class="small" data-open>审阅</button></div>
    <div class="chips">${t.files.map(f=>`<span class="chip" data-path="${f.path}">${f.path}${f.op==='X'?'（命令产生）':''}</span>`).join('')}</div>`);
  card.dataset.turn=t.n;
  card.querySelector('[data-open]').onclick=()=>{S.open={turn:t.n,path:t.files[0].path};render();};
  card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.open={turn:t.n,path:c.dataset.path};render();});
  render();
}

function laterTouch(turn,path){ return S.turns.find(x=>x.n>turn.n && x.files.some(f=>f.path===path && !f.undone)); }
function requestUndo(turn,f){
  const later=laterTouch(turn,f.path);
  if(later){ f.msg={cls:'warn',t:`${f.path} 在${later.id}又被修改，不能单独撤销第 ${turn.n} 轮的版本。先撤销${later.id}对它的修改，再撤销本轮。`}; render(); return; }
  if(f.externallyEdited){ f.msg={cls:'err',t:`${f.path} 在本轮之后被外部修改（可能是编辑器），为避免覆盖你的修改，已拒绝撤销；工作区未改动。`}; render(); return; }
  f.pending=true; render();
  const timer=setTimeout(()=>{f.pending=false;f.undone=true;f.msg={cls:'',t:'已撤销，文件恢复到本轮之前的状态。'};syncChips();render();},5000);
  toast(`将在 5 秒后撤销 ${f.path}`,()=>{clearTimeout(timer);f.pending=false;render();});
}
function undoTurn(turn){
  const blocked=turn.files.filter(f=>f.op!=='X'&&!f.undone&&(laterTouch(turn,f.path)||f.externallyEdited));
  if(blocked.length){ blocked.forEach(f=>requestUndo(turn,f)); return; }
  turn.files.filter(f=>f.op!=='X'&&!f.undone).forEach(f=>f.pending=true); render();
  const timer=setTimeout(()=>{turn.files.forEach(f=>{if(f.pending){f.pending=false;f.undone=true;f.msg={cls:'',t:'已撤销。'};}});syncChips();render();},5000);
  toast(`将在 5 秒后撤销${turn.id}的全部改动`,()=>{clearTimeout(timer);turn.files.forEach(f=>f.pending=false);render();});
}
function syncChips(){ document.querySelectorAll('.chg').forEach(c=>{const t=S.turns.find(x=>x.n==c.dataset.turn); c.querySelectorAll('.chip').forEach(ch=>{const f=t.files.find(x=>x.path===ch.dataset.path); ch.classList.toggle('undone',!!f.undone);});}); }

function render(){
  $('run').textContent=S.running?'运行中':'空闲'; $('send').disabled=S.running;
  const L=$('list'); L.innerHTML='';
  if(!S.turns.length){L.innerHTML='<div class="empty">还没有改动。<br>Agent 写入文件后，每一轮的改动会列在这里，可按文件撤销。</div>';return;}
  for(const t of S.turns){
    const el=document.createElement('div'); el.className='turn';
    const [p,m]=turnStats(t); const live=t.files.filter(f=>f.op!=='X'&&!f.undone).length;
    el.innerHTML=`<div class="turn-h"><b>${t.id}</b><span class="stat"><span class="plus">+${p}</span> <span class="minus">−${m}</span></span><small>${live} 个文件未撤销</small></div>`;
    const btn=document.createElement('button'); btn.className='small'; btn.textContent='撤销本轮全部'; btn.disabled=!live||t.files.some(f=>f.pending); btn.onclick=()=>undoTurn(t);
    el.querySelector('.turn-h').appendChild(btn);
    for(const f of t.files){
      const fe=document.createElement('div'); fe.className='f'+(f.undone?' undone':'');
      const opn={M:'修改',C:'新建',D:'删除',X:'命令产生'}[f.op]; const [fp,fm]=stats(f);
      fe.innerHTML=`<div class="f-row"><span class="op op-${f.op}">${opn}</span><span class="path" title="${f.path}">${f.path}</span>${f.op!=='X'?`<span class="stat"><span class="plus">+${fp}</span> <span class="minus">−${fm}</span></span>`:''}<span class="state">${f.undone?'已撤销':f.pending?'即将撤销…':''}</span></div>`;
      const isOpen=S.open&&S.open.turn===t.n&&S.open.path===f.path;
      if(isOpen){
        if(f.op==='X'){ fe.insertAdjacentHTML('beforeend',`<div class="msg warn">${f.why}</div>`); }
        else {
          fe.insertAdjacentHTML('beforeend',`<div class="diff">${f.diff.map(([k,x])=>`<span class="${k}">${esc(x)}</span>`).join('')}</div>`);
          const a=document.createElement('div'); a.className='f-act';
          const u=document.createElement('button'); u.className='small'; u.textContent='撤销此文件'; u.disabled=!!(f.undone||f.pending); u.onclick=()=>requestUndo(t,f);
          const h=document.createElement('button'); h.className='small'; h.textContent='按块撤销（第二步）'; h.disabled=true; h.title='逐块撤销列为第二步';
          a.appendChild(u); a.appendChild(h); fe.appendChild(a);
        }
        if(f.msg) fe.insertAdjacentHTML('beforeend',`<div class="msg ${f.msg.cls}">${f.msg.t}</div>`);
      }
      fe.querySelector('.f-row').onclick=()=>{S.open=isOpen?null:{turn:t.n,path:f.path};render();};
      el.appendChild(fe);
    }
    L.appendChild(el);
  }
}
$('d-reset').onclick=reset; $('d-run1').onclick=()=>run(1); $('d-run2').onclick=()=>run(2);
$('send').onclick=()=>{$('prompt').value='';run(S.turns.length?2:1);};
$('d-ext').onclick=()=>{const t=S.turns.find(x=>x.n===1); if(!t){toast('先运行第 1 轮');return;} t.files.find(f=>f.path==='tests/calc.test.ts').externallyEdited=true; toast('已模拟：你在编辑器里改了 tests/calc.test.ts');};
reset();
})();
</script>
</body>
</html>
